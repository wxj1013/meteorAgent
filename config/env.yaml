# 总体环境的配置文件

# 工作空间，可修改
workspace: "E:/MeteorAgentWs"

# 角色分配，目前先都暂定1个，后续可能扩展为多角色分布式
roles:
  coder: 1 # 编码人
  engineer: 1 # 模型工程师

# 日志级别
log:
  level: "INFO"

# python版本
python:
  version: "3.10.3"

# GPU版本和可用性
cuda:
  available: true
  version: "12.1"
  device: "NVIDIA GeForce RTX 2070"

# 是否支持自行安装第三方库
constraints:
  allow_install: false

# python第三方库列表
packages:
  torch: "2.5.1+cu121"
  torchvision: "0.20.1+cu121"
  transformers: "4.57.3"
  numpy: "2.0.0"
  matplotlib: "3.9.3"


